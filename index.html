<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLMun Portal · Document Request System</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<header class="glass-panel top" id="nav"></header>
<main id="app" tabindex="-1"></main>

<!-- Simulated Gmail invitation modal -->
<dialog id="mail" aria-labelledby="mailTitle">
  <h2 id="mailTitle">Simulated Gmail inbox</h2>
  <div id="mailBody"></div>
  <div class="row"><button class="btn btn-ghost" type="button" data-act="close">Close</button></div>
</dialog>

<div id="toasts" aria-live="polite"></div>

<div id="notifPopover" class="notif-popover" role="menu" hidden>
  <div class="notif-head">
    <strong>Notifications</strong>
    <div class="notif-tabs" role="tablist">
      <button role="tab" data-tab="all" aria-selected="true">All</button>
      <button role="tab" data-tab="unread" aria-selected="false">Unread</button>
      <button role="tab" data-tab="request" aria-selected="false">Requests</button>
    </div>
    <button class="btn btn-ghost btn-sm" data-act="readall" aria-label="Mark all as read">Mark all read</button>
  </div>
  <ul id="notifPopList" class="notif-list" role="menuitem"></ul>
  <div class="notif-foot"><a href="#" data-act="viewAll">View all notifications</a></div>
</div>

<script src="app.js"></script>
</body>
</html>
